services:
  postgres:
    image: postgres:18.1-alpine3.22
    container_name: mailsangja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailsangja}
      POSTGRES_USER: ${POSTGRES_USER:-mailsangja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailsangja}
    volumes:
      - mailsangja_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mailsangja}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-alpine3.22
    container_name: mailsangja-redis
    restart: unless-stopped
    volumes:
      - mailsangja_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: ghcr.io/${IMAGE_NAME}:${APP_IMAGE_TAG}
    container_name: mailsangja-core
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${POSTGRES_DB:-mailsangja}
      DB_USERNAME: ${POSTGRES_USER:-mailsangja}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mailsangja}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mailsangja_postgres_data:
    external: true
  mailsangja_redis_data:
    external: true
