services:
  caddy:
    image: caddy:2.11.2-alpine
    container_name: mailsangja-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mailsangja_caddy_data:/data
      - mailsangja_caddy_config:/config
    depends_on:
      core:
        condition: service_started

  postgres:
    image: postgres:18.1-alpine3.22
    container_name: mailsangja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mailsangja}
      POSTGRES_USER: ${DB_USERNAME:-mailsangja}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mailsangja}
    volumes:
      - mailsangja_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mailsangja}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-alpine3.22
    container_name: mailsangja-redis
    restart: unless-stopped
    volumes:
      - mailsangja_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    container_name: mailsangja-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - mailsangja_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: ghcr.io/${CORE_IMAGE_NAME}:${APP_IMAGE_TAG}
    container_name: mailsangja-core
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mailsangja}
      DB_USERNAME: ${DB_USERNAME:-mailsangja}
      DB_PASSWORD: ${DB_PASSWORD:-mailsangja}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_PUBLISHER_CONFIRM_TYPE: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE:-correlated}
      RABBITMQ_PUBLISHER_RETURNS: ${RABBITMQ_PUBLISHER_RETURNS:-true}
      MAIL_TASK_EXCHANGE: ${MAIL_TASK_EXCHANGE:-mailsangja.mail.task}
      MAIL_TASK_DLX_EXCHANGE: ${MAIL_TASK_DLX_EXCHANGE:-mailsangja.mail.task.dlx}
      MAIL_TASK_TTL: ${MAIL_TASK_TTL:-30m}
      MAIL_TASK_RETRY_MAX_ATTEMPTS: ${MAIL_TASK_RETRY_MAX_ATTEMPTS:-3}
      MAIL_TASK_CONCURRENCY: ${MAIL_TASK_CONCURRENCY:-1}
      MAIL_TASK_PUBLISHER_MANDATORY: ${MAIL_TASK_PUBLISHER_MANDATORY:-true}
      MAIL_SYNC_TASK_NAME: ${MAIL_SYNC_TASK_NAME:-sync.gmail.initial}
      GOOGLE_PUBSUB_PUSH_OIDC_JWK_SET_URI: ${GOOGLE_PUBSUB_PUSH_OIDC_JWK_SET_URI:-https://www.googleapis.com/oauth2/v3/certs}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_1: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_1:-https://accounts.google.com}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_2: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_2:-accounts.google.com}
      GOOGLE_PUBSUB_PUSH_OIDC_AUDIENCE: ${GOOGLE_PUBSUB_PUSH_OIDC_AUDIENCE}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      GOOGLE_GMAIL_WATCH_TOPIC_NAME: ${GOOGLE_GMAIL_WATCH_TOPIC_NAME}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CALLBACK_REDIRECT_URI: ${CALLBACK_REDIRECT_URI}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ghcr.io/${WORKER_IMAGE_NAME}:${APP_IMAGE_TAG}
    container_name: mailsangja-worker
    restart: unless-stopped
    environment:
      WORKER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mailsangja}
      DB_USERNAME: ${DB_USERNAME:-mailsangja}
      DB_PASSWORD: ${DB_PASSWORD:-mailsangja}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      MAIL_TASK_EXCHANGE: ${MAIL_TASK_EXCHANGE:-mailsangja.mail.task}
      MAIL_TASK_DLX_EXCHANGE: ${MAIL_TASK_DLX_EXCHANGE:-mailsangja.mail.task.dlx}
      MAIL_TASK_TTL: ${MAIL_TASK_TTL:-30m}
      MAIL_TASK_RETRY_MAX_ATTEMPTS: ${MAIL_TASK_RETRY_MAX_ATTEMPTS:-3}
      MAIL_TASK_CONCURRENCY: ${MAIL_TASK_CONCURRENCY:-1}
      MAIL_TASK_PUBLISHER_MANDATORY: ${MAIL_TASK_PUBLISHER_MANDATORY:-true}
      MAIL_SYNC_TASK_NAME: ${MAIL_SYNC_TASK_NAME:-sync.gmail.initial}
      MAIL_WATCH_RENEWAL_TASK_NAME: ${MAIL_WATCH_RENEWAL_TASK_NAME:-watch.renewal.gmail}
      GOOGLE_GMAIL_INITIAL_SYNC_MAX_RESULTS: ${GOOGLE_GMAIL_INITIAL_SYNC_MAX_RESULTS:-100}
      GOOGLE_GMAIL_WATCH_RENEWAL_ENABLED: ${GOOGLE_GMAIL_WATCH_RENEWAL_ENABLED:-false}
      GOOGLE_GMAIL_WATCH_RENEWAL_CRON: ${GOOGLE_GMAIL_WATCH_RENEWAL_CRON:-0 0 * * * *}
      GOOGLE_GMAIL_WATCH_RENEWAL_WINDOW: ${GOOGLE_GMAIL_WATCH_RENEWAL_WINDOW:-1d}
      GOOGLE_GMAIL_WATCH_RENEWAL_BATCH_SIZE: ${GOOGLE_GMAIL_WATCH_RENEWAL_BATCH_SIZE:-50}
      GOOGLE_GMAIL_WATCH_TOPIC_NAME: ${GOOGLE_GMAIL_WATCH_TOPIC_NAME}
      GOOGLE_GMAIL_WATCH_URI: ${GOOGLE_GMAIL_WATCH_URI:-https://gmail.googleapis.com/gmail/v1/users/me/watch}
      GOOGLE_GMAIL_WATCH_CONNECT_TIMEOUT: ${GOOGLE_GMAIL_WATCH_CONNECT_TIMEOUT:-3s}
      GOOGLE_GMAIL_WATCH_READ_TIMEOUT: ${GOOGLE_GMAIL_WATCH_READ_TIMEOUT:-5s}
      GOOGLE_GMAIL_WATCH_LABEL_FILTER_BEHAVIOR: ${GOOGLE_GMAIL_WATCH_LABEL_FILTER_BEHAVIOR:-}
      GOOGLE_GMAIL_MESSAGES_URI: ${GOOGLE_GMAIL_MESSAGES_URI:-https://gmail.googleapis.com/gmail/v1/users/me/messages}
      GOOGLE_GMAIL_MESSAGES_CONNECT_TIMEOUT: ${GOOGLE_GMAIL_MESSAGES_CONNECT_TIMEOUT:-3s}
      GOOGLE_GMAIL_MESSAGES_READ_TIMEOUT: ${GOOGLE_GMAIL_MESSAGES_READ_TIMEOUT:-5s}
      GOOGLE_GMAIL_HISTORY_URI: ${GOOGLE_GMAIL_HISTORY_URI:-https://gmail.googleapis.com/gmail/v1/users/me/history}
      GOOGLE_GMAIL_HISTORY_CONNECT_TIMEOUT: ${GOOGLE_GMAIL_HISTORY_CONNECT_TIMEOUT:-3s}
      GOOGLE_GMAIL_HISTORY_READ_TIMEOUT: ${GOOGLE_GMAIL_HISTORY_READ_TIMEOUT:-5s}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_TOKEN_URI: ${GOOGLE_TOKEN_URI:-https://oauth2.googleapis.com/token}
      GOOGLE_PUBSUB_PUSH_OIDC_JWK_SET_URI: ${GOOGLE_PUBSUB_PUSH_OIDC_JWK_SET_URI:-https://www.googleapis.com/oauth2/v3/certs}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_1: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_1:-https://accounts.google.com}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_2: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_2:-accounts.google.com}
      GOOGLE_PUBSUB_PUSH_OIDC_AUDIENCE: ${GOOGLE_PUBSUB_PUSH_OIDC_AUDIENCE}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_SERVICE_ACCOUNT_EMAIL:-}
      MAILSANGJA_FCM_SERVICE_ACCOUNT_KEY_PATH: ${MAILSANGJA_FCM_SERVICE_ACCOUNT_KEY_PATH:-firebase-key.json}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mailsangja_postgres_data:
    external: true
  mailsangja_redis_data:
    external: true
  mailsangja_rabbitmq_data:
    external: true
  mailsangja_caddy_data:
    external: true
  mailsangja_caddy_config:
    external: true
