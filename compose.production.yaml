services:
  caddy:
    image: caddy:2.11.2-alpine
    container_name: mailsangja-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Asia/Seoul
      API_DOMAIN: ${API_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mailsangja_caddy_data:/data
      - mailsangja_caddy_config:/config
    depends_on:
      core:
        condition: service_started

  postgres:
    image: ghcr.io/${POSTGRES_IMAGE_NAME}:${APP_IMAGE_TAG}
    container_name: mailsangja-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PGDATA: /var/lib/postgresql
      POSTGRES_DB: ${DB_NAME:-mailsangja}
      POSTGRES_USER: ${DB_USERNAME:-mailsangja}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mailsangja}
    volumes:
      - mailsangja_postgres_data:/var/lib/postgresql
      - ./db/src/main/resources/extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mailsangja}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-alpine3.22
    container_name: mailsangja-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    volumes:
      - mailsangja_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    container_name: mailsangja-rabbitmq
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - mailsangja_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: ghcr.io/${CORE_IMAGE_NAME}:${APP_IMAGE_TAG}
    container_name: mailsangja-core
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ghcr.io/${WORKER_IMAGE_NAME}:${APP_IMAGE_TAG}
    container_name: mailsangja-worker
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mailsangja_postgres_data:
    external: true
  mailsangja_redis_data:
    external: true
  mailsangja_rabbitmq_data:
    external: true
  mailsangja_caddy_data:
    external: true
  mailsangja_caddy_config:
    external: true
