services:
  caddy:
    image: caddy:2.11.2-alpine
    container_name: mailsangja-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mailsangja_caddy_data:/data
      - mailsangja_caddy_config:/config
    depends_on:
      core:
        condition: service_started

  postgres:
    image: postgres:18.1-alpine3.22
    container_name: mailsangja-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mailsangja}
      POSTGRES_USER: ${DB_USERNAME:-mailsangja}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mailsangja}
    volumes:
      - mailsangja_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mailsangja}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-alpine3.22
    container_name: mailsangja-redis
    restart: unless-stopped
    volumes:
      - mailsangja_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: ghcr.io/${IMAGE_NAME}:${APP_IMAGE_TAG}
    container_name: mailsangja-core
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mailsangja}
      DB_USERNAME: ${DB_USERNAME:-mailsangja}
      DB_PASSWORD: ${DB_PASSWORD:-mailsangja}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_PUBLISHER_CONFIRM_TYPE: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE:-correlated}
      RABBITMQ_PUBLISHER_RETURNS: ${RABBITMQ_PUBLISHER_RETURNS:-true}
      MAIL_SYNC_EXCHANGE: ${MAIL_SYNC_EXCHANGE:-mailsangja.mail.sync}
      MAIL_SYNC_QUEUE: ${MAIL_SYNC_QUEUE:-mailsangja.mail.sync.gmail.initial}
      MAIL_SYNC_ROUTING_KEY: ${MAIL_SYNC_ROUTING_KEY:-mail.sync.gmail.initial}
      MAIL_SYNC_DLX_EXCHANGE: ${MAIL_SYNC_DLX_EXCHANGE:-mailsangja.mail.sync.dlx}
      MAIL_SYNC_DLX_QUEUE: ${MAIL_SYNC_DLX_QUEUE:-mailsangja.mail.sync.gmail.initial.dlq}
      MAIL_SYNC_DLX_ROUTING_KEY: ${MAIL_SYNC_DLX_ROUTING_KEY:-mail.sync.gmail.initial.dlq}
      MAIL_SYNC_TTL: ${MAIL_SYNC_TTL:-30m}
      MAIL_SYNC_RETRY_MAX_ATTEMPTS: ${MAIL_SYNC_RETRY_MAX_ATTEMPTS:-3}
      MAIL_SYNC_CONCURRENCY: ${MAIL_SYNC_CONCURRENCY:-1}
      MAIL_SYNC_PUBLISHER_MANDATORY: ${MAIL_SYNC_PUBLISHER_MANDATORY:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CALLBACK_REDIRECT_URI: ${CALLBACK_REDIRECT_URI}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mailsangja_postgres_data:
    external: true
  mailsangja_redis_data:
    external: true
  mailsangja_caddy_data:
    external: true
  mailsangja_caddy_config:
    external: true
