services:
  caddy:
    image: caddy:2.11.2-alpine
    container_name: mailsangja-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TZ: Asia/Seoul
      API_DOMAIN: ${API_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - mailsangja_caddy_data:/data
      - mailsangja_caddy_config:/config
    depends_on:
      core:
        condition: service_started

  postgres:
    image: ghcr.io/${POSTGRES_IMAGE_NAME}:${APP_IMAGE_TAG}
    container_name: mailsangja-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      PGDATA: /var/lib/postgresql
      POSTGRES_DB: ${DB_NAME:-mailsangja}
      POSTGRES_USER: ${DB_USERNAME:-mailsangja}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mailsangja}
    volumes:
      - mailsangja_postgres_data:/var/lib/postgresql
      - ./db/src/main/resources/extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mailsangja}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-alpine3.22
    container_name: mailsangja-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
    volumes:
      - mailsangja_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    container_name: mailsangja-rabbitmq
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - mailsangja_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:3.5.8
    container_name: mailsangja-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./docker/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - mailsangja_loki_data:/loki

  tempo:
    image: grafana/tempo:2.9.0
    container_name: mailsangja-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./docker/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - mailsangja_tempo_data:/var/tempo

  alloy:
    image: grafana/alloy:v1.11.3
    container_name: mailsangja-alloy
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./docker/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - mailsangja_app_logs:/var/log/mailsangja:ro
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

  grafana:
    image: grafana/grafana:12.3.0
    container_name: mailsangja-grafana
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_AUTH_ANONYMOUS_ENABLED:-false}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://${API_DOMAIN}/api/admin/dashboard/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-true}
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - mailsangja_grafana_data:/var/lib/grafana
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started

  core:
    image: ghcr.io/${CORE_IMAGE_NAME}:${APP_IMAGE_TAG}
    container_name: mailsangja-core
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
      CORE_LOG_FILE: /var/log/mailsangja/core.log
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:-true}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:-http://alloy:4318/v1/traces}
    env_file:
      - .env
    volumes:
      - mailsangja_app_logs:/var/log/mailsangja
    depends_on:
      alloy:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    image: ghcr.io/${WORKER_IMAGE_NAME}:${APP_IMAGE_TAG}
    container_name: mailsangja-worker
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
      WORKER_LOG_FILE: /var/log/mailsangja/worker.log
      MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:-true}
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:-http://alloy:4318/v1/traces}
    env_file:
      - .env
    volumes:
      - mailsangja_app_logs:/var/log/mailsangja
    depends_on:
      alloy:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mailsangja_postgres_data:
    external: true
  mailsangja_redis_data:
    external: true
  mailsangja_rabbitmq_data:
    external: true
  mailsangja_caddy_data:
    external: true
  mailsangja_caddy_config:
    external: true
  mailsangja_app_logs:
    external: true
  mailsangja_loki_data:
    external: true
  mailsangja_tempo_data:
    external: true
  mailsangja_grafana_data:
    external: true
