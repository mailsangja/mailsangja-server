services:
  postgres:
    image: postgres:18.1-alpine3.22
    container_name: mailsangja-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-mailsangja}
      POSTGRES_USER: ${DB_USERNAME:-mailsangja}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mailsangja}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-mailsangja}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.4.0-alpine3.22
    container_name: mailsangja-redis
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    container_name: mailsangja-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: mailsangja-core
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mailsangja}
      DB_USERNAME: ${DB_USERNAME:-mailsangja}
      DB_PASSWORD: ${DB_PASSWORD:-mailsangja}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_PUBLISHER_CONFIRM_TYPE: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE:-correlated}
      RABBITMQ_PUBLISHER_RETURNS: ${RABBITMQ_PUBLISHER_RETURNS:-true}
      MAIL_SYNC_EXCHANGE: ${MAIL_SYNC_EXCHANGE:-mailsangja.mail.sync}
      MAIL_SYNC_QUEUE: ${MAIL_SYNC_QUEUE:-mailsangja.mail.sync.gmail.initial}
      MAIL_SYNC_ROUTING_KEY: ${MAIL_SYNC_ROUTING_KEY:-mail.sync.gmail.initial}
      MAIL_SYNC_DLX_EXCHANGE: ${MAIL_SYNC_DLX_EXCHANGE:-mailsangja.mail.sync.dlx}
      MAIL_SYNC_DLX_QUEUE: ${MAIL_SYNC_DLX_QUEUE:-mailsangja.mail.sync.gmail.initial.dlq}
      MAIL_SYNC_DLX_ROUTING_KEY: ${MAIL_SYNC_DLX_ROUTING_KEY:-mail.sync.gmail.initial.dlq}
      MAIL_SYNC_TTL: ${MAIL_SYNC_TTL:-30m}
      MAIL_SYNC_RETRY_MAX_ATTEMPTS: ${MAIL_SYNC_RETRY_MAX_ATTEMPTS:-3}
      MAIL_SYNC_CONCURRENCY: ${MAIL_SYNC_CONCURRENCY:-1}
      MAIL_SYNC_PUBLISHER_MANDATORY: ${MAIL_SYNC_PUBLISHER_MANDATORY:-true}
      GOOGLE_PUBSUB_PUSH_OIDC_JWK_SET_URI: ${GOOGLE_PUBSUB_PUSH_OIDC_JWK_SET_URI:-https://www.googleapis.com/oauth2/v3/certs}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_1: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_1:-https://accounts.google.com}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_2: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_2:-accounts.google.com}
      GOOGLE_PUBSUB_PUSH_OIDC_AUDIENCE: ${GOOGLE_PUBSUB_PUSH_OIDC_AUDIENCE}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/mail-accounts/google/callback}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      GOOGLE_GMAIL_WATCH_TOPIC_NAME: ${GOOGLE_GMAIL_WATCH_TOPIC_NAME}
      CALLBACK_REDIRECT_URI: ${CALLBACK_REDIRECT_URI:-https://mail.localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: mailsangja-worker
    ports:
      - "${WORKER_PORT:-8081}:8081"
    environment:
      WORKER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mailsangja}
      DB_USERNAME: ${DB_USERNAME:-mailsangja}
      DB_PASSWORD: ${DB_PASSWORD:-mailsangja}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      MAIL_SYNC_EXCHANGE: ${MAIL_SYNC_EXCHANGE:-mailsangja.mail.sync}
      MAIL_SYNC_QUEUE: ${MAIL_SYNC_QUEUE:-mailsangja.mail.sync.gmail.initial}
      MAIL_SYNC_ROUTING_KEY: ${MAIL_SYNC_ROUTING_KEY:-mail.sync.gmail.initial}
      MAIL_SYNC_DLX_EXCHANGE: ${MAIL_SYNC_DLX_EXCHANGE:-mailsangja.mail.sync.dlx}
      MAIL_SYNC_DLX_QUEUE: ${MAIL_SYNC_DLX_QUEUE:-mailsangja.mail.sync.gmail.initial.dlq}
      MAIL_SYNC_DLX_ROUTING_KEY: ${MAIL_SYNC_DLX_ROUTING_KEY:-mail.sync.gmail.initial.dlq}
      MAIL_SYNC_TTL: ${MAIL_SYNC_TTL:-30m}
      MAIL_SYNC_RETRY_MAX_ATTEMPTS: ${MAIL_SYNC_RETRY_MAX_ATTEMPTS:-3}
      MAIL_SYNC_CONCURRENCY: ${MAIL_SYNC_CONCURRENCY:-1}
      MAIL_SYNC_PUBLISHER_MANDATORY: ${MAIL_SYNC_PUBLISHER_MANDATORY:-true}
      MAIL_WATCH_RENEWAL_EXCHANGE: ${MAIL_WATCH_RENEWAL_EXCHANGE:-mailsangja.mail.watch.renewal}
      MAIL_WATCH_RENEWAL_QUEUE: ${MAIL_WATCH_RENEWAL_QUEUE:-mailsangja.mail.watch.renewal.gmail}
      MAIL_WATCH_RENEWAL_ROUTING_KEY: ${MAIL_WATCH_RENEWAL_ROUTING_KEY:-mail.watch.renewal.gmail}
      MAIL_WATCH_RENEWAL_DLX_EXCHANGE: ${MAIL_WATCH_RENEWAL_DLX_EXCHANGE:-mailsangja.mail.watch.renewal.dlx}
      MAIL_WATCH_RENEWAL_DLX_QUEUE: ${MAIL_WATCH_RENEWAL_DLX_QUEUE:-mailsangja.mail.watch.renewal.gmail.dlq}
      MAIL_WATCH_RENEWAL_DLX_ROUTING_KEY: ${MAIL_WATCH_RENEWAL_DLX_ROUTING_KEY:-mail.watch.renewal.gmail.dlq}
      MAIL_WATCH_RENEWAL_TTL: ${MAIL_WATCH_RENEWAL_TTL:-30m}
      MAIL_WATCH_RENEWAL_RETRY_MAX_ATTEMPTS: ${MAIL_WATCH_RENEWAL_RETRY_MAX_ATTEMPTS:-3}
      MAIL_WATCH_RENEWAL_CONCURRENCY: ${MAIL_WATCH_RENEWAL_CONCURRENCY:-1}
      MAIL_WATCH_RENEWAL_PUBLISHER_MANDATORY: ${MAIL_WATCH_RENEWAL_PUBLISHER_MANDATORY:-true}
      GOOGLE_GMAIL_WATCH_RENEWAL_ENABLED: ${GOOGLE_GMAIL_WATCH_RENEWAL_ENABLED:-false}
      GOOGLE_GMAIL_WATCH_RENEWAL_CRON: ${GOOGLE_GMAIL_WATCH_RENEWAL_CRON:-0 0 * * * *}
      GOOGLE_GMAIL_WATCH_RENEWAL_WINDOW: ${GOOGLE_GMAIL_WATCH_RENEWAL_WINDOW:-1d}
      GOOGLE_GMAIL_WATCH_RENEWAL_BATCH_SIZE: ${GOOGLE_GMAIL_WATCH_RENEWAL_BATCH_SIZE:-50}
      GOOGLE_GMAIL_WATCH_TOPIC_NAME: ${GOOGLE_GMAIL_WATCH_TOPIC_NAME}
      GOOGLE_GMAIL_WATCH_URI: ${GOOGLE_GMAIL_WATCH_URI:-https://gmail.googleapis.com/gmail/v1/users/me/watch}
      GOOGLE_GMAIL_WATCH_CONNECT_TIMEOUT: ${GOOGLE_GMAIL_WATCH_CONNECT_TIMEOUT:-3s}
      GOOGLE_GMAIL_WATCH_READ_TIMEOUT: ${GOOGLE_GMAIL_WATCH_READ_TIMEOUT:-5s}
      GOOGLE_GMAIL_WATCH_LABEL_FILTER_BEHAVIOR: ${GOOGLE_GMAIL_WATCH_LABEL_FILTER_BEHAVIOR:-}
      GOOGLE_GMAIL_MESSAGES_URI: ${GOOGLE_GMAIL_MESSAGES_URI:-https://gmail.googleapis.com/gmail/v1/users/me/messages}
      GOOGLE_GMAIL_MESSAGES_CONNECT_TIMEOUT: ${GOOGLE_GMAIL_MESSAGES_CONNECT_TIMEOUT:-3s}
      GOOGLE_GMAIL_MESSAGES_READ_TIMEOUT: ${GOOGLE_GMAIL_MESSAGES_READ_TIMEOUT:-5s}
      GOOGLE_GMAIL_HISTORY_URI: ${GOOGLE_GMAIL_HISTORY_URI:-https://gmail.googleapis.com/gmail/v1/users/me/history}
      GOOGLE_GMAIL_HISTORY_CONNECT_TIMEOUT: ${GOOGLE_GMAIL_HISTORY_CONNECT_TIMEOUT:-3s}
      GOOGLE_GMAIL_HISTORY_READ_TIMEOUT: ${GOOGLE_GMAIL_HISTORY_READ_TIMEOUT:-5s}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_TOKEN_URI: ${GOOGLE_TOKEN_URI:-https://oauth2.googleapis.com/token}
      GOOGLE_PUBSUB_PUSH_OIDC_JWK_SET_URI: ${GOOGLE_PUBSUB_PUSH_OIDC_JWK_SET_URI:-https://www.googleapis.com/oauth2/v3/certs}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_1: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_1:-https://accounts.google.com}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_2: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_2:-accounts.google.com}
      GOOGLE_PUBSUB_PUSH_OIDC_AUDIENCE: ${GOOGLE_PUBSUB_PUSH_OIDC_AUDIENCE}
      GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_SERVICE_ACCOUNT_EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  redis-data:
  rabbitmq_data:
