name: Build Postgres Docker Image

on:
  push:
    branches:
      - main
    paths:
      - docker/postgres/Dockerfile
      - .github/workflows/build-postgres-image.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

jobs:
  build-postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive postgres image name
        id: postgres-image
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}/mailsangja-postgres" >> "$GITHUB_OUTPUT"

      - name: Build and push postgres image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/postgres/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ steps.postgres-image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=postgres
          cache-to: type=gha,scope=postgres,mode=max
