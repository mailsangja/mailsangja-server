spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

mailsangja:
  rabbitmq:
    task:
      exchange: ${MAIL_TASK_EXCHANGE:mailsangja.mail.task}
      dead-letter-exchange: ${MAIL_TASK_DLX_EXCHANGE:mailsangja.mail.task.dlx}
      ttl: ${MAIL_TASK_TTL:30m}
      retry-initial-interval: ${MAIL_TASK_RETRY_INITIAL_INTERVAL:30000}
      retry-multiplier: ${MAIL_TASK_RETRY_MULTIPLIER:2.0}
      retry-max-interval: ${MAIL_TASK_RETRY_MAX_INTERVAL:300000}
      publisher-mandatory: ${MAIL_TASK_PUBLISHER_MANDATORY:true}
    initial-mail-sync:
      concurrency: ${INITIAL_MAIL_SYNC_CONCURRENCY:1}
      prefetch: ${INITIAL_MAIL_SYNC_PREFETCH:1}
      thread-batch-concurrency: ${INITIAL_MAIL_SYNC_THREAD_BATCH_CONCURRENCY:3}
      thread-batch-prefetch: ${INITIAL_MAIL_SYNC_THREAD_BATCH_PREFETCH:5}
    gmail-history:
      message-added-concurrency: ${GMAIL_MESSAGE_ADDED_CONCURRENCY:2}
      message-added-prefetch: ${GMAIL_MESSAGE_ADDED_PREFETCH:3}
      state-concurrency: ${GMAIL_HISTORY_STATE_CONCURRENCY:3}
      state-prefetch: ${GMAIL_HISTORY_STATE_PREFETCH:10}
    watch-renewal:
      concurrency: ${WATCH_RENEWAL_CONCURRENCY:1}
      prefetch: ${WATCH_RENEWAL_PREFETCH:1}
    label-reclassify:
      message-batch-size: ${LABEL_RECLASSIFY_MESSAGE_BATCH_SIZE:50}
      concurrency: ${LABEL_RECLASSIFY_CONCURRENCY:2}
      prefetch: ${LABEL_RECLASSIFY_PREFETCH:2}
    mail-embedding:
      concurrency: ${MAIL_EMBEDDING_CONCURRENCY:2}
      prefetch: ${MAIL_EMBEDDING_PREFETCH:2}
    reply-draft-suggestion:
      concurrency: ${REPLY_DRAFT_SUGGESTION_CONCURRENCY:2}
      prefetch: ${REPLY_DRAFT_SUGGESTION_PREFETCH:2}
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL:}
