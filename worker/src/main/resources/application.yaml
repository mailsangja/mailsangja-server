server:
  port: ${WORKER_PORT:8081}

spring:
  application:
    name: worker

  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: ${AI_CHAT_PROVIDER:openai}
      embedding: ${AI_EMBEDDING_PROVIDER:openai}
      embedding.text: ${AI_EMBEDDING_PROVIDER:openai}
      image: none
      moderation: none
    vectorstore:
      type: ${AI_VECTORSTORE_TYPE:pgvector}
      pgvector:
        table-name: ${AI_PGVECTOR_TABLE_NAME:vector_store}
        dimensions: ${AI_PGVECTOR_DIMENSIONS:1536}
        index-type: ${AI_PGVECTOR_INDEX_TYPE:HNSW}
        distance-type: ${AI_PGVECTOR_DISTANCE_TYPE:COSINE_DISTANCE}
        id-type: ${AI_PGVECTOR_ID_TYPE:UUID}
        initialize-schema: ${AI_PGVECTOR_INITIALIZE_SCHEMA:true}
        remove-existing-vector-store-table: false
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        api-key: ${OPENAI_CHAT_API_KEY:${OPENROUTER_API_KEY:${OPENAI_API_KEY}}}
        base-url: ${OPENAI_CHAT_BASE_URL:${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}}
        options:
          model: ${AI_DEFAULT_MODEL:${OPENAI_CHAT_MODEL:google/gemini-3.5-flash}}
          temperature: ${OPENAI_CHAT_TEMPERATURE:0.3}
      embedding:
        api-key: ${OPENAI_EMBEDDING_API_KEY:${OPENAI_API_KEY}}
        base-url: ${OPENAI_EMBEDDING_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY:unused-google-genai-api-key}
        chat:
          options:
            model: ${GOOGLE_GENAI_CHAT_MODEL:gemini-2.0-flash}
        embedding:
          api-key: ${GOOGLE_GENAI_API_KEY:unused-google-genai-api-key}
          text:
            options:
              model: ${GOOGLE_GENAI_EMBEDDING_MODEL:text-embedding-004}
              dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}

  config:
    import: "classpath:application-mq.yaml"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mailsangja}
    username: ${DB_USERNAME:mailsangja}
    password: ${DB_PASSWORD:mailsangja}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: false

  sql:
    init:
      mode: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  page-title: MailSangja Worker API Reference

mailsangja:
  ai:
    model:
      default-model: ${AI_DEFAULT_MODEL:google/gemini-3.5-flash}
      reply-draft-suggestion-model: ${REPLY_DRAFT_SUGGESTION_MODEL:${AI_REPLY_MODEL:${AI_DEFAULT_MODEL:google/gemini-3.5-flash}}}
      allowed-models: ${AI_ALLOWED_MODELS:google/gemini-3.5-flash,google/gemini-3.1-pro-preview,google/gemini-3.1-flash-lite,google/gemini-3-pro-preview,google/gemini-3-flash-preview,google/gemini-2.5-pro,google/gemini-2.5-flash,google/gemini-2.5-flash-lite,openai/gpt-5.5,openai/gpt-5.5-pro,openai/gpt-5.4-nano,openai/gpt-5.4-mini,openai/gpt-5.4,openai/gpt-5.4-pro,openai/gpt-5.3-chat,openai/gpt-5.3-codex,openai/gpt-5.2-chat,openai/gpt-5.2,openai/gpt-5.1,openai/gpt-4.1,openai/gpt-4.1-mini,openai/gpt-4.1-nano,qwen/qwen3.6-flash,qwen/qwen3.5-plus-20260420,anthropic/claude-haiku-4.5,anthropic/claude-sonnet-4.6,anthropic/claude-sonnet-4.5,anthropic/claude-sonnet-4,anthropic/claude-opus-4.7,anthropic/claude-opus-4.7-fast,anthropic/claude-opus-4.6,anthropic/claude-opus-4.6-fast,anthropic/claude-opus-4.1,anthropic/claude-opus-4,mistralai/mistral-medium-3-5,x-ai/grok-4.3}
    reply-draft:
      min-thread-message-count: ${AI_REPLY_DRAFT_MIN_THREAD_MESSAGE_COUNT:3}
    embedding:
      metadata-hash:
        secret: ${AI_METADATA_HASH_SECRET:}
  gmail:
    rate-limit:
      enabled: ${GOOGLE_GMAIL_RATE_LIMIT_ENABLED:true}
      fail-open: ${GOOGLE_GMAIL_RATE_LIMIT_FAIL_OPEN:true}
      per-user-capacity-units: ${GOOGLE_GMAIL_RATE_LIMIT_PER_USER_CAPACITY_UNITS:12000}
      per-user-refill-units-per-minute: ${GOOGLE_GMAIL_RATE_LIMIT_PER_USER_REFILL_UNITS_PER_MINUTE:12000}
      key-ttl: ${GOOGLE_GMAIL_RATE_LIMIT_KEY_TTL:2m}
    watch-renewal:
      enabled: ${GOOGLE_GMAIL_WATCH_RENEWAL_ENABLED:false}
      cron: ${GOOGLE_GMAIL_WATCH_RENEWAL_CRON:0 0 * * * *}
      renewal-window: ${GOOGLE_GMAIL_WATCH_RENEWAL_WINDOW:1d}
      batch-size: ${GOOGLE_GMAIL_WATCH_RENEWAL_BATCH_SIZE:50}
    google-watch:
      topic-name: ${GOOGLE_GMAIL_WATCH_TOPIC_NAME}
      watch-uri: ${GOOGLE_GMAIL_WATCH_URI:https://gmail.googleapis.com/gmail/v1/users/me/watch}
      connect-timeout: ${GOOGLE_GMAIL_WATCH_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_GMAIL_WATCH_READ_TIMEOUT:5s}
      label-filter-behavior: ${GOOGLE_GMAIL_WATCH_LABEL_FILTER_BEHAVIOR:}
    push:
      local-ack:
        enabled: ${GOOGLE_GMAIL_PUSH_LOCAL_ACK_ENABLED:false}
        whitelisted-error-codes: ${GOOGLE_GMAIL_PUSH_LOCAL_ACK_WHITELIST:}
      oidc:
        jwk-set-uri: ${GOOGLE_PUBSUB_PUSH_OIDC_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
        allowed-issuers:
          - ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_1:https://accounts.google.com}
          - ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_ISSUER_2:accounts.google.com}
        audience: ${GOOGLE_PUBSUB_PUSH_OIDC_AUDIENCE}
        allowed-service-account-email: ${GOOGLE_PUBSUB_PUSH_OIDC_ALLOWED_SERVICE_ACCOUNT_EMAIL:}
    initial-sync:
      max-threads: ${GOOGLE_GMAIL_INITIAL_SYNC_MAX_THREADS:2000}
      thread-list-page-size: ${GOOGLE_GMAIL_INITIAL_SYNC_THREAD_LIST_PAGE_SIZE:500}
      thread-batch-size: ${GOOGLE_GMAIL_INITIAL_SYNC_THREAD_BATCH_SIZE:5}
      threads-uri: ${GOOGLE_GMAIL_THREADS_URI:https://gmail.googleapis.com/gmail/v1/users/me/threads}
      connect-timeout: ${GOOGLE_GMAIL_MESSAGES_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_GMAIL_MESSAGES_READ_TIMEOUT:5s}
    google-history:
      history-uri: ${GOOGLE_GMAIL_HISTORY_URI:https://gmail.googleapis.com/gmail/v1/users/me/history}
      connect-timeout: ${GOOGLE_GMAIL_HISTORY_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_GMAIL_HISTORY_READ_TIMEOUT:5s}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
  fcm:
    service-account-key-json: ${MAILSANGJA_FCM_SERVICE_ACCOUNT_KEY_JSON}
    service-account-key-path: ${MAILSANGJA_FCM_SERVICE_ACCOUNT_KEY_PATH:firebase-key.json}
    logo-image-url: ${MAILSANGJA_FCM_LOGO_IMAGE_URL:https://www.ajou.ac.kr/_res/ajou/kr/img/intro/img-symbol.png}
    thread-detail-url-template: ${MAILSANGJA_FCM_THREAD_DETAIL_URL_TEMPLATE:https://mail.ajou.app/mail/inbox?thread={threadId}&message={messageId}}
  portone:
    api-secret: ${PORTONE_API_SECRET}
    payment-query-uri: ${PORTONE_PAYMENT_QUERY_URI:https://api.portone.io/payments}
    connect-timeout: ${PORTONE_CONNECT_TIMEOUT:3s}
    read-timeout: ${PORTONE_READ_TIMEOUT:5s}
