server:
  port: ${WORKER_PORT:8081}

spring:
  application:
    name: worker

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mailsangja}
    username: ${DB_USERNAME:mailsangja}
    password: ${DB_PASSWORD:mailsangja}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: true

  sql:
    init:
      mode: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  page-title: MailSangja Worker API Reference

mailsangja:
  rabbitmq:
    initial-mail-sync:
      exchange: ${MAIL_SYNC_EXCHANGE:mailsangja.mail.sync}
      queue: ${MAIL_SYNC_QUEUE:mailsangja.mail.sync.gmail.initial}
      routing-key: ${MAIL_SYNC_ROUTING_KEY:mail.sync.gmail.initial}
      dead-letter-exchange: ${MAIL_SYNC_DLX_EXCHANGE:mailsangja.mail.sync.dlx}
      dead-letter-queue: ${MAIL_SYNC_DLX_QUEUE:mailsangja.mail.sync.gmail.initial.dlq}
      dead-letter-routing-key: ${MAIL_SYNC_DLX_ROUTING_KEY:mail.sync.gmail.initial.dlq}
      ttl: ${MAIL_SYNC_TTL:30m}
      retry-max-attempts: ${MAIL_SYNC_RETRY_MAX_ATTEMPTS:3}
      concurrency: ${MAIL_SYNC_CONCURRENCY:1}
      publisher-mandatory: ${MAIL_SYNC_PUBLISHER_MANDATORY:true}
  gmail:
    initial-sync:
      max-results: ${GOOGLE_GMAIL_INITIAL_SYNC_MAX_RESULTS:20}
      messages-uri: ${GOOGLE_GMAIL_MESSAGES_URI:https://gmail.googleapis.com/gmail/v1/users/me/messages}
      connect-timeout: ${GOOGLE_GMAIL_MESSAGES_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_GMAIL_MESSAGES_READ_TIMEOUT:5s}
    google-history:
      history-uri: ${GOOGLE_GMAIL_HISTORY_URI:https://gmail.googleapis.com/gmail/v1/users/me/history}
      connect-timeout: ${GOOGLE_GMAIL_HISTORY_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_GMAIL_HISTORY_READ_TIMEOUT:5s}
