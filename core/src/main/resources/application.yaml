spring:
  application:
    name: core

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE:correlated}
    publisher-returns: ${RABBITMQ_PUBLISHER_RETURNS:true}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mailsangja}
    username: ${DB_USERNAME:mailsangja}
    password: ${DB_PASSWORD:mailsangja}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:init.sql

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  page-title: MailSangja API Reference

mailsangja:
  portone:
    plan-prices:
      pro: ${PORTONE_PLAN_PRICE_PRO:9900}
    api-secret: ${PORTONE_API_SECRET}
    payment-query-uri: ${PORTONE_PAYMENT_QUERY_URI:https://api.portone.io/payments}
    connect-timeout: ${PORTONE_CONNECT_TIMEOUT:3s}
    read-timeout: ${PORTONE_READ_TIMEOUT:5s}
  rabbitmq:
    task:
      exchange: ${MAIL_TASK_EXCHANGE:mailsangja.mail.task}
      dead-letter-exchange: ${MAIL_TASK_DLX_EXCHANGE:mailsangja.mail.task.dlx}
      ttl: ${MAIL_TASK_TTL:30m}
      retry-max-attempts: ${MAIL_TASK_RETRY_MAX_ATTEMPTS:3}
      concurrency: ${MAIL_TASK_CONCURRENCY:1}
      publisher-mandatory: ${MAIL_TASK_PUBLISHER_MANDATORY:true}
    initial-mail-sync:
      task-name: ${MAIL_SYNC_TASK_NAME:sync.gmail.initial}
  inbox:
    page-size: ${INBOX_PAGE_SIZE:50}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/mail-accounts/google/callback}
      callback-redirect-uri: ${CALLBACK_REDIRECT_URI:https://mail.localhost}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
      connect-timeout: ${GOOGLE_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_READ_TIMEOUT:5s}
      scopes:
        - openid
        - email
        - https://mail.google.com/
        - https://www.googleapis.com/auth/contacts.readonly
  google:
    people:
      connections-uri: ${GOOGLE_PEOPLE_CONNECTIONS_URI:https://people.googleapis.com/v1/people/me/connections}
      page-size: ${GOOGLE_PEOPLE_CONTACTS_PAGE_SIZE:1000}
      connect-timeout: ${GOOGLE_PEOPLE_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_PEOPLE_READ_TIMEOUT:10s}
  gmail:
    google-watch:
      topic-name: ${GOOGLE_GMAIL_WATCH_TOPIC_NAME:projects/local/topics/mailbox-gmail-watch}
      watch-uri: ${GOOGLE_GMAIL_WATCH_URI:https://gmail.googleapis.com/gmail/v1/users/me/watch}
      thread-modify-uri: ${GOOGLE_GMAIL_THREAD_MODIFY_URI:https://gmail.googleapis.com/gmail/v1/users/me/threads/{gmailThreadId}/modify}
      message-modify-uri: ${GOOGLE_GMAIL_MESSAGE_MODIFY_URI:https://gmail.googleapis.com/gmail/v1/users/me/messages/{gmailMessageId}/modify}
      send-uri: ${GOOGLE_GMAIL_SEND_URI:https://gmail.googleapis.com/gmail/v1/users/me/messages/send}
      messages-uri: ${GOOGLE_GMAIL_MESSAGES_URI:https://gmail.googleapis.com/gmail/v1/users/me/messages}
      attachments-uri: ${GOOGLE_GMAIL_ATTACHMENTS_URI:https://gmail.googleapis.com/gmail/v1/users/me/messages}
      connect-timeout: ${GOOGLE_GMAIL_WATCH_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_GMAIL_WATCH_READ_TIMEOUT:5s}
      label-filter-behavior: ${GOOGLE_GMAIL_WATCH_LABEL_FILTER_BEHAVIOR:}
    api:
      base-uri: ${GOOGLE_GMAIL_API_BASE_URI:https://gmail.googleapis.com}
      connect-timeout: ${GOOGLE_GMAIL_API_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_GMAIL_API_READ_TIMEOUT:10s}
