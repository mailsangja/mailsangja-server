spring:
  application:
    name: core

  servlet:
    multipart:
      max-file-size: ${MULTIPART_MAX_FILE_SIZE:10MB}
      max-request-size: ${MULTIPART_MAX_REQUEST_SIZE:20MB}

  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: ${AI_CHAT_PROVIDER:openai}
      embedding: ${AI_EMBEDDING_PROVIDER:openai}
      embedding.text: ${AI_EMBEDDING_PROVIDER:openai}
      image: none
      moderation: none
    vectorstore:
      type: ${AI_VECTORSTORE_TYPE:pgvector}
      pgvector:
        table-name: ${AI_PGVECTOR_TABLE_NAME:vector_store}
        dimensions: ${AI_PGVECTOR_DIMENSIONS:1536}
        index-type: ${AI_PGVECTOR_INDEX_TYPE:HNSW}
        distance-type: ${AI_PGVECTOR_DISTANCE_TYPE:COSINE_DISTANCE}
        id-type: ${AI_PGVECTOR_ID_TYPE:UUID}
        initialize-schema: ${AI_PGVECTOR_INITIALIZE_SCHEMA:true}
        remove-existing-vector-store-table: false
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        api-key: ${OPENAI_CHAT_API_KEY:${OPENROUTER_API_KEY:${OPENAI_API_KEY}}}
        base-url: ${OPENAI_CHAT_BASE_URL:${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}}
        options:
          model: ${AI_DEFAULT_MODEL:${OPENAI_CHAT_MODEL:google/gemini-3.5-flash}}
          temperature: ${OPENAI_CHAT_TEMPERATURE:0.3}
      embedding:
        api-key: ${OPENAI_EMBEDDING_API_KEY:${OPENAI_API_KEY}}
        base-url: ${OPENAI_EMBEDDING_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com}}
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY:unused-google-genai-api-key}
        chat:
          options:
            model: ${GOOGLE_GENAI_CHAT_MODEL:gemini-2.0-flash}
        embedding:
          api-key: ${GOOGLE_GENAI_API_KEY:unused-google-genai-api-key}
          text:
            options:
              model: ${GOOGLE_GENAI_EMBEDDING_MODEL:text-embedding-004}
              dimensions: ${AI_EMBEDDING_DIMENSIONS:1536}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE:correlated}
    publisher-returns: ${RABBITMQ_PUBLISHER_RETURNS:true}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mailsangja}
    username: ${DB_USERNAME:mailsangja}
    password: ${DB_PASSWORD:mailsangja}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:init.sql
      separator: ";;"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

logging:
  structured:
    format:
      file: ${LOGGING_STRUCTURED_FORMAT_FILE:logstash}
  file:
    name: ${CORE_LOG_FILE:${LOG_FILE:}}
  level:
    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:OFF}
    org.hibernate.orm.jdbc.bind: ${LOGGING_LEVEL_HIBERNATE_BIND:OFF}

management:
  otlp:
    metrics:
      export:
        enabled: ${MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      otlp:
        enabled: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          timeout: ${MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_TIMEOUT:10s}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  page-title: MailSangja API Reference

mailsangja:
  ai:
    model:
      default-model: ${AI_DEFAULT_MODEL:${MAIL_DRAFT_DEFAULT_MODEL:google/gemini-3.5-flash}}
      draft-model: ${MAIL_DRAFT_MODEL:${AI_DRAFT_MODEL:${AI_DEFAULT_MODEL:${MAIL_DRAFT_DEFAULT_MODEL:google/gemini-3.5-flash}}}}
      label-suggestion-model: ${LABEL_SUGGESTION_MODEL:${AI_LABEL_MODEL:${AI_DEFAULT_MODEL:google/gemini-3.5-flash}}}
      allowed-models: ${AI_ALLOWED_MODELS:${MAIL_DRAFT_ALLOWED_MODELS:google/gemini-3.5-flash,google/gemini-3.1-pro-preview,google/gemini-3.1-flash-lite,google/gemini-3-pro-preview,google/gemini-3-flash-preview,google/gemini-2.5-pro,google/gemini-2.5-flash,google/gemini-2.5-flash-lite,openai/gpt-5.5,openai/gpt-5.5-pro,openai/gpt-5.4-nano,openai/gpt-5.4-mini,openai/gpt-5.4,openai/gpt-5.4-pro,openai/gpt-5.3-chat,openai/gpt-5.3-codex,openai/gpt-5.2-chat,openai/gpt-5.2,openai/gpt-5.1,openai/gpt-4.1,openai/gpt-4.1-mini,openai/gpt-4.1-nano,qwen/qwen3.6-flash,qwen/qwen3.5-plus-20260420,anthropic/claude-haiku-4.5,anthropic/claude-sonnet-4.6,anthropic/claude-sonnet-4.5,anthropic/claude-sonnet-4,anthropic/claude-opus-4.7,anthropic/claude-opus-4.7-fast,anthropic/claude-opus-4.6,anthropic/claude-opus-4.6-fast,anthropic/claude-opus-4.1,anthropic/claude-opus-4,mistralai/mistral-medium-3-5,x-ai/grok-4.3}}
  redis:
    rate-limit:
      enabled: ${MAILSANGJA_REDIS_RATE_LIMIT_ENABLED:true}
      weekly-draft-limit: ${MAILSANGJA_REDIS_RATE_LIMIT_WEEKLY_DRAFT_LIMIT:10}
      weekly-review-limit: ${MAILSANGJA_REDIS_RATE_LIMIT_WEEKLY_REVIEW_LIMIT:10}
      weekly-suggestion-limit: ${MAILSANGJA_REDIS_RATE_LIMIT_WEEKLY_SUGGESTION_LIMIT:2}
  label:
    debounce:
      debounce-seconds: ${LABEL_DEBOUNCE_SECONDS:60}
      scheduler-fixed-delay-seconds: ${LABEL_DEBOUNCE_SCHEDULER_DELAY:10}
      rate-limit-window-seconds: ${LABEL_DEBOUNCE_RATE_LIMIT_WINDOW:60}
      rate-limit-max-requests: ${LABEL_DEBOUNCE_RATE_LIMIT_MAX_REQUESTS:20}
    suggestion:
      recent-mail-count: ${LABEL_SUGGESTION_RECENT_MAIL_COUNT:20}
  portone:
    plan-prices:
      pro: ${PORTONE_PLAN_PRICE_PRO:9900}
    api-secret: ${PORTONE_API_SECRET}
    payment-query-uri: ${PORTONE_PAYMENT_QUERY_URI:https://api.portone.io/payments}
    connect-timeout: ${PORTONE_CONNECT_TIMEOUT:3s}
    read-timeout: ${PORTONE_READ_TIMEOUT:5s}
  rabbitmq:
    task:
      exchange: ${MAIL_TASK_EXCHANGE:mailsangja.mail.task}
      dead-letter-exchange: ${MAIL_TASK_DLX_EXCHANGE:mailsangja.mail.task.dlx}
      ttl: ${MAIL_TASK_TTL:30m}
      retry-max-attempts: ${MAIL_TASK_RETRY_MAX_ATTEMPTS:3}
      concurrency: ${MAIL_TASK_CONCURRENCY:1}
      publisher-mandatory: ${MAIL_TASK_PUBLISHER_MANDATORY:true}
    initial-mail-sync:
      task-name: ${MAIL_SYNC_TASK_NAME:sync.gmail.initial}
  mail-account:
    max-count: ${MAIL_ACCOUNT_MAX_COUNT:2}
  inbox:
    page-size: ${INBOX_PAGE_SIZE:50}
    api-base-uri: ${INBOX_API_BASE_URI:http://localhost:8080}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/mail-accounts/google/callback}
      callback-redirect-uri: ${CALLBACK_REDIRECT_URI:https://mail.localhost}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
      connect-timeout: ${GOOGLE_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_READ_TIMEOUT:5s}
      scopes:
        - openid
        - email
        - https://www.googleapis.com/auth/gmail.modify
        - https://www.googleapis.com/auth/contacts.readonly
        - https://www.googleapis.com/auth/contacts.other.readonly
  google:
    people:
      connections-uri: ${GOOGLE_PEOPLE_CONNECTIONS_URI:https://people.googleapis.com/v1/people/me/connections}
      other-contacts-uri: ${GOOGLE_PEOPLE_OTHER_CONTACTS_URI:https://people.googleapis.com/v1/otherContacts}
      page-size: ${GOOGLE_PEOPLE_CONTACTS_PAGE_SIZE:1000}
      connect-timeout: ${GOOGLE_PEOPLE_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_PEOPLE_READ_TIMEOUT:10s}
  gmail:
    google-watch:
      topic-name: ${GOOGLE_GMAIL_WATCH_TOPIC_NAME:projects/local/topics/mailbox-gmail-watch}
      watch-uri: ${GOOGLE_GMAIL_WATCH_URI:https://gmail.googleapis.com/gmail/v1/users/me/watch}
      stop-uri: ${GOOGLE_GMAIL_STOP_URI:https://gmail.googleapis.com/gmail/v1/users/me/stop}
      thread-modify-uri: ${GOOGLE_GMAIL_THREAD_MODIFY_URI:https://gmail.googleapis.com/gmail/v1/users/me/threads/{gmailThreadId}/modify}
      message-modify-uri: ${GOOGLE_GMAIL_MESSAGE_MODIFY_URI:https://gmail.googleapis.com/gmail/v1/users/me/messages/{gmailMessageId}/modify}
      send-uri: ${GOOGLE_GMAIL_SEND_URI:https://gmail.googleapis.com/gmail/v1/users/me/messages/send}
      messages-uri: ${GOOGLE_GMAIL_MESSAGES_URI:https://gmail.googleapis.com/gmail/v1/users/me/messages}
      attachments-uri: ${GOOGLE_GMAIL_ATTACHMENTS_URI:https://gmail.googleapis.com/gmail/v1/users/me/messages}
      connect-timeout: ${GOOGLE_GMAIL_WATCH_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_GMAIL_WATCH_READ_TIMEOUT:5s}
      label-filter-behavior: ${GOOGLE_GMAIL_WATCH_LABEL_FILTER_BEHAVIOR:}
    api:
      base-uri: ${GOOGLE_GMAIL_API_BASE_URI:https://gmail.googleapis.com}
      connect-timeout: ${GOOGLE_GMAIL_API_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_GMAIL_API_READ_TIMEOUT:10s}
