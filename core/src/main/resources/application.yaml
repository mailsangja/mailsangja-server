spring:
  application:
    name: core

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: ${RABBITMQ_PUBLISHER_CONFIRM_TYPE:correlated}
    publisher-returns: ${RABBITMQ_PUBLISHER_RETURNS:true}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mailsangja}
    username: ${DB_USERNAME:mailsangja}
    password: ${DB_PASSWORD:mailsangja}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public
        format_sql: true

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

scalar:
  enabled: true
  path: /scalar
  url: /v3/api-docs
  page-title: MailSangja API Reference

mailsangja:
  rabbitmq:
    initial-mail-sync:
      exchange: ${MAIL_SYNC_EXCHANGE:mailsangja.mail.sync}
      queue: ${MAIL_SYNC_QUEUE:mailsangja.mail.sync.gmail.initial}
      routing-key: ${MAIL_SYNC_ROUTING_KEY:mail.sync.gmail.initial}
      dead-letter-exchange: ${MAIL_SYNC_DLX_EXCHANGE:mailsangja.mail.sync.dlx}
      dead-letter-queue: ${MAIL_SYNC_DLX_QUEUE:mailsangja.mail.sync.gmail.initial.dlq}
      dead-letter-routing-key: ${MAIL_SYNC_DLX_ROUTING_KEY:mail.sync.gmail.initial.dlq}
      ttl: ${MAIL_SYNC_TTL:30m}
      retry-max-attempts: ${MAIL_SYNC_RETRY_MAX_ATTEMPTS:3}
      concurrency: ${MAIL_SYNC_CONCURRENCY:1}
      publisher-mandatory: ${MAIL_SYNC_PUBLISHER_MANDATORY:true}
  inbox:
    page-size: ${INBOX_PAGE_SIZE:50}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/mail-accounts/google/callback}
      callback-redirect-uri: ${CALLBACK_REDIRECT_URI:https://mail.localhost}
      authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
      connect-timeout: ${GOOGLE_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_READ_TIMEOUT:5s}
      scopes:
        - openid
        - email
        - https://mail.google.com/
  gmail:
    google-watch:
      topic-name: ${GOOGLE_GMAIL_WATCH_TOPIC_NAME}
      watch-uri: ${GOOGLE_GMAIL_WATCH_URI:https://gmail.googleapis.com/gmail/v1/users/me/watch}
      connect-timeout: ${GOOGLE_GMAIL_WATCH_CONNECT_TIMEOUT:3s}
      read-timeout: ${GOOGLE_GMAIL_WATCH_READ_TIMEOUT:5s}
      label-filter-behavior: ${GOOGLE_GMAIL_WATCH_LABEL_FILTER_BEHAVIOR:}
