spring:
  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: none
      embedding: none
      embedding.text: none
      image: none
      moderation: none
    vectorstore:
      type: none
      pgvector:
        initialize-schema: false
    google:
      genai:
        embedding:
          api-key: unused-google-genai-api-key

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  datasource:
    url: jdbc:h2:mem:core-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: public
  sql:
    init:
      mode: never

  data:
    redis:
      repositories:
        enabled: false

  session:
    redis:
      configure-action: none

mailsangja:
  ai:
    model:
      default-model: google/gemini-3.5-flash
      allowed-models:
        - google/gemini-3.5-flash
        - google/gemini-3.1-pro-preview
        - google/gemini-3.1-flash-lite
        - google/gemini-3-pro-preview
        - google/gemini-3-flash-preview
        - google/gemini-2.5-pro
        - google/gemini-2.5-flash
        - google/gemini-2.5-flash-lite
        - openai/gpt-5.5
        - openai/gpt-5.5-pro
        - openai/gpt-5.4-nano
        - openai/gpt-5.4-mini
        - openai/gpt-5.4
        - openai/gpt-5.4-pro
        - openai/gpt-5.3-chat
        - openai/gpt-5.3-codex
        - openai/gpt-5.2-chat
        - openai/gpt-5.2
        - openai/gpt-5.1
        - openai/gpt-4.1
        - openai/gpt-4.1-mini
        - openai/gpt-4.1-nano
        - qwen/qwen3.6-flash
        - qwen/qwen3.5-plus-20260420
        - anthropic/claude-haiku-4.5
        - anthropic/claude-sonnet-4.6
        - anthropic/claude-sonnet-4.5
        - anthropic/claude-sonnet-4
        - anthropic/claude-opus-4.7
        - anthropic/claude-opus-4.7-fast
        - anthropic/claude-opus-4.6
        - anthropic/claude-opus-4.6-fast
        - anthropic/claude-opus-4.1
        - anthropic/claude-opus-4
        - mistralai/mistral-medium-3-5
        - x-ai/grok-4.3
  redis:
    rate-limit:
      enabled: true
      monthly-limit: 50
  label:
    debounce:
      debounce-seconds: 60
      scheduler-fixed-delay-seconds: 10
      rate-limit-window-seconds: 60
      rate-limit-max-requests: 20
  portone:
    api-secret: test-api-secret
    payment-query-uri: https://api.portone.io/payments
    connect-timeout: 3s
    read-timeout: 5s
  rabbitmq:
    task:
      exchange: mailsangja.mail.task
      dead-letter-exchange: mailsangja.mail.task.dlx
      ttl: 30m
      retry-max-attempts: 3
      concurrency: 1
      publisher-mandatory: true
    initial-mail-sync:
      task-name: sync.gmail.initial
  inbox:
    api-base-uri: https://test-api.mailsangja.com
  oauth:
    google:
      client-id: test-client-id
      client-secret: test-client-secret
