spring:
  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: none
      embedding: none
      image: none
      moderation: none
    vectorstore:
      type: none
      pgvector:
        initialize-schema: false

  datasource:
    url: jdbc:h2:mem:core-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: public
  sql:
    init:
      mode: never

  data:
    redis:
      repositories:
        enabled: false

  session:
    redis:
      configure-action: none

mailsangja:
  rabbitmq:
    task:
      exchange: mailsangja.mail.task
      dead-letter-exchange: mailsangja.mail.task.dlx
      ttl: 30m
      retry-max-attempts: 3
      concurrency: 1
      publisher-mandatory: true
    initial-mail-sync:
      task-name: sync.gmail.initial
  oauth:
    google:
      client-id: test-client-id
      client-secret: test-client-secret
